<section id="roomScene" *ngIf="roomIsVisible">
  <div class="roomContainer">
    <img src="assets/Sfondo_mainPage6.png" alt="Stanza" class="roomImage" />
    <svg
      class="roomOverlay"
      viewBox="0 0 1920 1080"
      preserveAspectRatio="xMidYMid meet"
    >
      <!--Project -->
      <g class="tv-project" (click)="OpenProject()">
        <rect
          x="69.5%"
          y="64.4%"
          width="3.2%"
          height="4.6%"
          rx="14"
          ry="14"
          class="tv-hitbox"
        />
        <image
          href="assets/tv-noise.jpg"
          x="69.5%"
          y="64.4%"
          width="3.2%"
          height="4.6%"
          preserveAspectRatio="xMidYMid slice"
          rx="14"
          ry="14"
          class="tv-glitch"
        />
        <text x="1366" y="725" text-anchor="middle" class="tv-icon">
          &lt;/&gt;
        </text>
      </g>

      <!--About me-->
      <g>
        <image
          class="frameImage"
          href="assets/Cornice1.png"
          x="1.0%"
          y="-12.9%"
          width="23.4%"
          height="74.1%"
          preserveAspectRatio="xMidYMid slice"
          *ngIf="!AboutMe"
        />
        <rect
          x="4%"
          y="-7%"
          width="18%"
          height="55%"
          class="button"
          (click)="OpenAboutMe()"
        />
      </g>
      <!--Contact -->
      <g>
        <image
          href="assets/Telefono.png"
          x="9.4%"
          y="59.3%"
          width="20.8%"
          height="50.9%"
          preserveAspectRatio="xMidYMid slice"
          *ngIf="!Contact"
        />
        <rect
          x="14%"
          y="67%"
          width="10%"
          height="20%"
          class="button"
          *ngIf="!Contact"
          (click)="OpenContact()"
        />
      </g>
      <!-- Form -->
      <g>
        <image
          href="assets/MacchinaDaScrivere.png"
          x="0%"
          y="58.3%"
          width="20.8%"
          height="50.9%"
          *ngIf="!Form"
        />
        <rect
          x="0%"
          y="80%"
          width="16%"
          height="20%"
          class="button"
          (click)="OpenForm()"
        />
      </g>
    </svg>
    <div class="contact-container" *ngIf="Contact">
      <div class="phone-container">
        <img src="assets/contact-telefono.png" class="phone" />
        <div class="contact-buttons">
          <a
            href="https://my.linkedin.com/in/elisa-puorto/en"
            class="fab fa-linkedin"
            target="_blank"
          ></a>
          <a
            href="https://github.com/E9-P8"
            class="fab fa-github"
            target="_blank"
          ></a>
          <a
            href="https://calendly.com/puorto-elisa"
            class="fas fa-phone"
            alt="Prendiamoci un caffe virtuale"
            target="_blank"
          ></a>
          <button class="close-btn" (click)="CloseContact()">
            [ HANG UP ]
          </button>
        </div>
      </div>
    </div>
    <div class="form-container" *ngIf="Form">
      <div class="form-macchina">
        <img src="../assets/Macchina-form.png" class="form-image-macchina" />
        <div class="form-paper" *ngIf="paperVisible" [class.sended]="isSended">
          <form class="email-form">
            <div class="form-row">
              <div class="field">
                <label>Nome</label>
                <input
                  type="text"
                  placeholder="Nome"
                  [(ngModel)]="form.name"
                  name="name"
                  required
                />
              </div>

              <div class="field">
                <label>Cognome</label>
                <input
                  type="text"
                  placeholder="Cognome"
                  [(ngModel)]="form.surname"
                  name="surname"
                  required
                />
              </div>
            </div>

            <div class="field">
              <label>Email</label>
              <input
                type="email"
                placeholder="Email"
                [(ngModel)]="form.email"
                name="email"
                required
              />
            </div>

            <div class="field">
              <label>Scrivimi qui la tua richiesta</label>
              <textarea
                placeholder="..."
                [(ngModel)]="form.message"
                name="message"
                required
              ></textarea>
            </div>

            <div class="form-actions">
              <button type="button" (click)="CloseForm()">Chiudi</button>
            </div>
          </form>
        </div>

        <button type="button" class="form-lever" (click)="sendEmail()">
          Invia
        </button>
        <div *ngIf="showPopup" class="popup-overlay">
          <div class="popup">
            <p>{{ popupMessage || "Email inviata con successo!" }}</p>
            <button (click)="onPopupClose()" class="btn-popup">OK</button>
          </div>
        </div>
      </div>
    </div>
    <div class="volume" (click)="toggleRoomMusic()">
      <button [class.is-muted]="!isAudioMuted">
        <svg viewBox="0 0 24 24" class="sound-waves" *ngIf="!isAudioMuted">
          <path
            class="wave-1"
            d="M10.7 10a3.5 3 0 0 1 0 4"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-width="2"
          />
          <path
            class="wave-2"
            d="M15.54 8.46a5 5 0 0 1 0 7.07"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-width="2"
          />
          <path
            class="wave-3"
            d="M19.07 4.93a10 10 0 0 1 0 14.14"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-width="2"
          />
          />
        </svg>
      </button>
    </div>
  </div>
</section>
